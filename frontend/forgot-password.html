<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Finder | Forgot Password</title>

<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#22c55e,#0f172a);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.box{
  background:white;
  width:90%;
  max-width:380px;
  padding:35px 30px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.box h2{
  margin-top:0;
  color:#0f172a;
  text-align:center;
}

.box p.sub{
  text-align:center;
  color:#666;
  font-size:14px;
  margin-top:-8px;
  margin-bottom:20px;
}

.step{ display:none; }
.step.active{ display:block; }

.input-box{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:15px;
}

.input-box i{ color:#22c55e; }

.input-box input{
  border:none;
  outline:none;
  flex:1;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-size:15px;
  cursor:pointer;
  margin-top:5px;
}

button:disabled{
  background:#a7f3d0;
  cursor:not-allowed;
}

.resend{
  display:block;
  text-align:center;
  margin-top:12px;
  font-size:13px;
  color:#0f172a;
  text-decoration:none;
  cursor:pointer;
}

.resend.disabled{
  color:#aaa;
  pointer-events:none;
}

.msg{
  font-size:13px;
  min-height:18px;
  text-align:center;
  margin-top:5px;
  color:#ef4444;
}

.back-link{
  display:block;
  text-align:center;
  margin-top:18px;
  font-size:13px;
  color:#555;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">
  <h2>🔒 Forgot Password</h2>

  <!-- STEP 1: Mobile Number -->
  <div class="step active" id="step1">
    <p class="sub">Enter your registered mobile number to receive an OTP.</p>

    <div class="input-box">
      <i class="fa-solid fa-mobile"></i>
      <input type="tel" id="mobile" placeholder="Mobile Number" maxlength="10">
    </div>

    <button id="sendOtpBtn" onclick="sendOtp()">Send OTP</button>
    <p class="msg" id="step1Msg"></p>
  </div>

  <!-- STEP 2: Verify OTP -->
  <div class="step" id="step2">
    <p class="sub">Enter the OTP sent to <span id="mobileDisplay"></span></p>

    <div class="input-box">
      <i class="fa-solid fa-key"></i>
      <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6">
    </div>

    <button id="verifyOtpBtn" onclick="verifyOtp()">Verify OTP</button>
    <a class="resend" id="resendLink" onclick="sendOtp(true)">Resend OTP</a>
    <p class="msg" id="step2Msg"></p>
  </div>

  <!-- STEP 3: New Password -->
  <div class="step" id="step3">
    <p class="sub">Set a new password for your account.</p>

    <div class="input-box">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="newPassword" placeholder="New Password">
    </div>

    <div class="input-box">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="confirmPassword" placeholder="Confirm New Password">
    </div>

    <button onclick="resetPassword()">Reset Password</button>
    <p class="msg" id="step3Msg"></p>
  </div>

  <!-- STEP 4: Done -->
  <div class="step" id="step4">
    <p class="sub" style="color:#22c55e; font-weight:bold; font-size:16px;">
      ✅ Password reset successful!
    </p>
    <button onclick="window.location.href='login.html'">Back to Login</button>
  </div>

  <a class="back-link" href="login.html">← Back to Login</a>
</div>

<script>
/*
  ================================================================
  BACKEND CONTRACT NEEDED (please implement these 3 endpoints):
  ================================================================

  1) POST /api/users/send-otp
     body:  { "phone": "9876543210" }
     success (200): { "message": "OTP sent" }
     error (404):   plain text or JSON if phone is not registered

  2) POST /api/users/verify-otp
     body:  { "phone": "9876543210", "otp": "123456" }
     success (200): { "message": "OTP verified", "resetToken": "..." }
       -> resetToken (or similar) is recommended so step 3 can't be
          reached without actually verifying the OTP. If your backend
          doesn't return one yet, this file still works without it,
          but please add one for security later.
     error (400):   plain text like "Invalid OTP"

  3) POST /api/users/reset-password
     body:  { "phone": "9876543210", "resetToken": "...", "newPassword": "..." }
     success (200): { "message": "Password reset successful" }
     error (400):   plain text explaining what went wrong

  Adjust API_BASE below once these exist. Until they exist, this page
  will show a clear "backend endpoint not available" message instead
  of silently failing.
  ================================================================
*/

const API_BASE = "http://127.0.0.1:8080/api/users";

let verifiedPhone = null;
let resetToken = null;
let resendTimer = null;

function showStep(stepId){
  document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
  document.getElementById(stepId).classList.add("active");
}

function setMsg(id, text, isError = true){
  const el = document.getElementById(id);
  el.style.color = isError ? "#ef4444" : "#22c55e";
  el.textContent = text;
}

async function sendOtp(isResend = false){
  const mobile = document.getElementById("mobile").value.trim();
  const msgId = isResend ? "step2Msg" : "step1Msg";

  if(!isResend){
    if(!/^\d{10}$/.test(mobile)){
      setMsg("step1Msg", "Enter a valid 10-digit mobile number.");
      return;
    }
  }

  const phoneToUse = isResend ? verifiedPhone : mobile;
  const btn = document.getElementById("sendOtpBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Sending..."; }

  try {
    const response = await fetch(`${API_BASE}/send-otp`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: phoneToUse })
    });

    if(!response.ok){
      const errorText = await response.text();
      setMsg(msgId, errorText || "This mobile number is not registered.");
      if(btn){ btn.disabled = false; btn.textContent = "Send OTP"; }
      return;
    }

    verifiedPhone = phoneToUse;
    document.getElementById("mobileDisplay").textContent = phoneToUse;
    setMsg(msgId, "OTP sent!", false);
    showStep("step2");
    startResendCooldown();

  } catch(err){
    console.error(err);
    setMsg(msgId, "Could not reach the server. Ask your backend team to add POST /api/users/send-otp.");
    if(btn){ btn.disabled = false; btn.textContent = "Send OTP"; }
  }
}

function startResendCooldown(seconds = 30){
  const link = document.getElementById("resendLink");
  link.classList.add("disabled");
  let remaining = seconds;
  link.textContent = `Resend OTP (${remaining}s)`;

  clearInterval(resendTimer);
  resendTimer = setInterval(() => {
    remaining--;
    if(remaining <= 0){
      clearInterval(resendTimer);
      link.classList.remove("disabled");
      link.textContent = "Resend OTP";
    } else {
      link.textContent = `Resend OTP (${remaining}s)`;
    }
  }, 1000);
}

async function verifyOtp(){
  const otp = document.getElementById("otp").value.trim();

  if(!/^\d{4,6}$/.test(otp)){
    setMsg("step2Msg", "Enter the OTP you received.");
    return;
  }

  const btn = document.getElementById("verifyOtpBtn");
  btn.disabled = true;
  btn.textContent = "Verifying...";

  try {
    const response = await fetch(`${API_BASE}/verify-otp`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: verifiedPhone, otp: otp })
    });

    if(!response.ok){
      const errorText = await response.text();
      setMsg("step2Msg", errorText || "Invalid OTP, please try again.");
      btn.disabled = false;
      btn.textContent = "Verify OTP";
      return;
    }

    const data = await response.json().catch(() => ({}));
    resetToken = data.resetToken || null;

    setMsg("step2Msg", "OTP verified!", false);
    showStep("step3");

  } catch(err){
    console.error(err);
    setMsg("step2Msg", "Could not reach the server. Ask your backend team to add POST /api/users/verify-otp.");
    btn.disabled = false;
    btn.textContent = "Verify OTP";
  }
}

async function resetPassword(){
  const next = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;

  if(next.length < 6){
    setMsg("step3Msg", "Password must be at least 6 characters.");
    return;
  }
  if(next !== confirm){
    setMsg("step3Msg", "Passwords do not match.");
    return;
  }

  try {
    const response = await fetch(`${API_BASE}/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        phone: verifiedPhone,
        resetToken: resetToken,
        newPassword: next
      })
    });

    if(!response.ok){
      const errorText = await response.text();
      setMsg("step3Msg", errorText || "Could not reset password.");
      return;
    }

    showStep("step4");

  } catch(err){
    console.error(err);
    setMsg("step3Msg", "Could not reach the server. Ask your backend team to add POST /api/users/reset-password.");
  }
}
</script>
<script src="js/responsive.js"></script>
</body>
</html>
