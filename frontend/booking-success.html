<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EV Finder | Booking Success</title>

<link rel="stylesheet" href="css/booking-success.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

<div class="card">

<div class="icon">
<i class="fa-solid fa-circle-check"></i>
</div>

<h1>Booking Confirmed!</h1>

<p>Your EV charging slot has been successfully booked.</p>

<div class="invoice">

<h3>📄 Booking Invoice</h3>

<p><b>Booking ID:</b> <span id="bId">-</span></p>
<p><b>Station:</b> <span id="bStation">-</span></p>
<p><b>Station Contact:</b> <a id="bStationPhoneLink" href="tel:" style="color: #0284c7; font-weight: 700; text-decoration: none;"><i class="fa-solid fa-phone"></i> <span id="bStationPhone">+91 9876543210</span></a></p>
<p><b>Slot:</b> <span id="bSlot">-</span></p>
<p><b>Vehicle Number:</b> <span id="vechiclenumber">-</span></p>
<p><b>Vehicle Type:</b> <span id="bVehicleType">-</span></p>
<p><b>Amount Paid:</b> <span id="bAmountPaid">-</span></p>
<p><b>Payment Method:</b> <span id="bPaymentType">-</span></p>

</div>

<div class="success-actions" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
  <button class="btn-download" onclick="downloadReceipt()">📄 Download Receipt</button>
  <button class="btn-email" onclick="sendReceiptToEmail()" style="background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 700; cursor: pointer;">📩 Email Receipt</button>
  <button class="btn-dashboard" onclick="goHome()">Go to Dashboard</button>
</div>

</div>

</div>

<script src="js/booking-sucess.js"></script>
<script src="js/responsive.js"></script>
</body>
</html>
