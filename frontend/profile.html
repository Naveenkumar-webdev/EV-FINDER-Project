<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f5d82">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">

<title>EV Finder | Profile</title>

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* Modern 2-Column Professional Profile Layout */
body {
  background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
  color: #0f172a;
}

.profile-dashboard {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 30px;
  margin-top: 15px;
  align-items: start;
}

/* Left Card: Summary Profile */
.profile-summary-card {
  background: var(--surface);
  border-radius: 28px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 35px 25px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.profile-summary-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  background: linear-gradient(90deg, #10b981 0%, #0f5d82 100%);
}

.avatar-container {
  position: relative;
  width: 140px;
  height: 140px;
  margin: 10px auto 20px;
}

.avatar-container img {
  width: 140px;
  height: 140px;
  border-radius: 36px;
  border: 5px solid var(--surface-soft);
  box-shadow: 0 15px 35px rgba(15, 23, 42, 0.09);
  object-fit: cover;
  background: #ffffff;
}

.avatar-badge-icon {
  position: absolute;
  bottom: -6px;
  right: -6px;
  background: #10b981;
  color: white;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 3.5px solid #ffffff;
  font-size: 12px;
  box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
}

.avatar-edit-overlay {
  position: absolute;
  top: 2px;
  right: 2px;
  background: #0f5d82;
  color: white;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 3px solid #ffffff;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(15, 93, 130, 0.35);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 5;
}

.avatar-edit-overlay:hover {
  transform: scale(1.15);
  background: #10b981;
  box-shadow: 0 8px 18px rgba(16, 185, 129, 0.45);
}

.profile-summary-card h2 {
  font-size: 1.55rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}

.profile-summary-card p.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(16, 185, 129, 0.08);
  color: #059669;
  padding: 6px 14px;
  border-radius: 99px;
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 30px;
}

.mini-stats-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.mini-stat-tile {
  background: var(--surface-soft);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 18px;
  text-align: left;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.mini-stat-tile:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 24px rgba(15, 23, 42, 0.04);
  border-color: rgba(15, 93, 130, 0.15);
}

.mini-stat-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}

.mini-stat-tile:nth-child(1) .mini-stat-icon { background: rgba(99, 102, 241, 0.09); color: #6366f1; }
.mini-stat-tile:nth-child(2) .mini-stat-icon { background: rgba(245, 158, 11, 0.09); color: #f59e0b; }
.mini-stat-tile:nth-child(3) .mini-stat-icon { background: rgba(16, 185, 129, 0.09); color: #10b981; }

.mini-stat-info h4 {
  font-size: 1.3rem;
  color: var(--text);
  font-weight: 800;
  line-height: 1.2;
}

.mini-stat-info span {
  font-size: 0.76rem;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Right Card: Account Details */
.profile-details-card {
  background: var(--surface);
  border-radius: 28px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 575px;
}

.profile-details-card h3 {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 25px;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.01em;
}

.profile-details-card h3 i {
  color: var(--primary);
}

.details-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  margin-bottom: 30px;
}

.detail-box {
  background: var(--surface-soft);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px 24px;
  display: flex;
  gap: 18px;
  align-items: center;
  transition: all 0.25s ease;
}

.detail-box:hover {
  border-color: rgba(15, 93, 130, 0.2);
  background: var(--surface);
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(15, 23, 42, 0.03);
}

.detail-box.full-width {
  grid-column: span 2;
}

.detail-icon {
  width: 50px;
  height: 50px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 1.25rem;
  flex-shrink: 0;
}

.detail-box:nth-child(1) .detail-icon { background: rgba(99, 102, 241, 0.08); color: #6366f1; }
.detail-box:nth-child(2) .detail-icon { background: rgba(6, 182, 212, 0.08); color: #06b6d4; }
.detail-box:nth-child(3) .detail-icon { background: rgba(16, 185, 129, 0.08); color: #10b981; }
.detail-box:nth-child(4) .detail-icon { background: rgba(245, 158, 11, 0.08); color: #f59e0b; }
.detail-box:nth-child(5) .detail-icon { background: rgba(236, 72, 153, 0.08); color: #ec4899; }

.detail-content {
  flex: 1;
}

.detail-content label {
  font-size: 0.78rem;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  display: block;
  margin-bottom: 4px;
}

.detail-content p {
  font-size: 1.05rem;
  color: var(--text);
  font-weight: 700;
  margin: 0;
  word-break: break-all;
}

.detail-content input {
  width: 100%;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 0.95rem;
  font-weight: 600;
  outline: none;
  display: none;
}

.detail-content input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15,93,130,0.15);
  background: #ffffff;
}

.editing .detail-content p {
  display: none;
}

.editing .detail-content input {
  display: block;
}

.actions-row {
  display: flex;
  gap: 20px;
  margin-top: 15px;
}

.actions-row button {
  flex: 1;
  padding: 18px;
  border: none;
  border-radius: 20px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.btn-edit {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: white;
  box-shadow: 0 10px 25px rgba(16,185,129,0.25);
}

.btn-edit:hover {
  box-shadow: 0 14px 35px rgba(16,185,129,0.35);
  transform: translateY(-3px);
}

.btn-password {
  background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
  color: white;
  box-shadow: 0 10px 25px rgba(14,165,233,0.25);
}

.btn-password:hover {
  box-shadow: 0 14px 35px rgba(14,165,233,0.35);
  transform: translateY(-3px);
}

.btn-logout {
  background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
  color: white;
  box-shadow: 0 10px 25px rgba(239,68,68,0.25);
}

.btn-logout:hover {
  box-shadow: 0 14px 35px rgba(239,68,68,0.35);
  transform: translateY(-3px);
}

/* Modal styling */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.6);
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
}

.modal-box {
  background: var(--surface);
  border-radius: 28px;
  padding: 40px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 35px 80px rgba(15, 23, 42, 0.15);
  border: 1px solid rgba(15, 23, 42, 0.05);
}

.modal-box h3 {
  font-size: 1.45rem;
  color: #0f172a;
  margin-top: 0;
  margin-bottom: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.modal-box input {
  width: 100%;
  padding: 15px;
  margin-bottom: 14px;
  border: 1px solid rgba(15, 23, 42, 0.08);
  border-radius: 14px;
  background: #f8fafc;
  color: #1e293b;
  font-size: 0.95rem;
  font-weight: 600;
  outline: none;
}

.modal-box input:focus {
  border-color: #0f5d82;
  box-shadow: 0 0 0 3px rgba(15, 93, 130, 0.1);
  background: #ffffff;
}

.modal-error-msg {
  color: #ef4444;
  font-size: 0.85rem;
  min-height: 18px;
  margin-bottom: 14px;
  font-weight: 600;
}

.modal-buttons {
  display: flex;
  gap: 12px;
}

.modal-buttons button {
  flex: 1;
  padding: 15px;
  border: none;
  border-radius: 14px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-modal-cancel {
  background: #f1f5f9;
  color: #475569;
  border: 1px solid rgba(15, 23, 42, 0.06);
}

.btn-modal-cancel:hover {
  background: #e2e8f0;
}

.btn-modal-save {
  background: #0f5d82;
  color: white;
}

.btn-modal-save:hover {
  background: #0d4e6d;
}

@media (max-width: 980px) {
  .profile-dashboard {
    grid-template-columns: 1fr !important;
    gap: 20px !important;
  }
  .profile-details-card {
    padding: 24px 16px !important;
    min-height: auto !important;
  }
  .profile-summary-card {
    padding: 24px 16px !important;
  }
  .details-grid {
    grid-template-columns: 1fr !important;
    gap: 14px !important;
  }
  .detail-box {
    padding: 14px 16px !important;
    gap: 12px !important;
  }
  .detail-box.full-width {
    grid-column: span 1 !important;
  }
  .detail-content p {
    font-size: 0.95rem !important;
    word-break: break-all !important;
    overflow-wrap: anywhere !important;
  }
  .actions-row {
    flex-direction: column !important;
    gap: 12px !important;
  }
  .actions-row button {
    width: 100% !important;
    padding: 14px !important;
  }
}

@media (max-width: 480px) {
  .profile-details-card h3 {
    font-size: 1.1rem !important;
  }
  .detail-icon {
    width: 42px !important;
    height: 42px !important;
    font-size: 1.1rem !important;
  }
  .avatar-container {
    width: 110px !important;
    height: 110px !important;
  }
  .avatar-container img {
    width: 110px !important;
    height: 110px !important;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <i class="fa-solid fa-bolt"></i>
      <h2>EV Finder</h2>
    </div>
    <ul>
      <li>
        <a href="layout.html">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>
      </li>
      <li>
        <a href="view-stations.html">
          <i class="fa-solid fa-location-dot"></i>
          Nearby Stations
        </a>
      <li>
        <a href="booking.html">
          <i class="fa-solid fa-calendar-check"></i>
          Book Charging
        </a>
      </li>
      <li>
        <a href="history.html">
          <i class="fa-solid fa-clock-rotate-left"></i>
          My Bookings
        </a>
      </li>
      <li class="active">
        <a href="profile.html">
          <i class="fa-solid fa-user"></i>
          Profile
        </a>
      </li>
      <li>
        <a href="index.html" onclick="localStorage.removeItem('loggedUser')">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="topbar">
      <h1>👤 My Profile</h1>
      <div class="profile" onclick="window.location.href='profile.html'">
        <i class="fa-solid fa-circle-user"></i>
      </div>
    </div>

    <!-- 2-Column Profile Dashboard Grid -->
    <div class="profile-dashboard">
      
      <!-- Left Column: Summary Card -->
      <div class="profile-summary-card">
        <div class="avatar-container">
          <img id="avatar" src="images/profile.png" alt="Profile Avatar">
          <label for="avatarUpload" class="avatar-edit-overlay" title="Upload Profile Picture">
            <i class="fa-solid fa-camera"></i>
          </label>
          <input type="file" id="avatarUpload" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">
          <div class="avatar-badge-icon" title="Verified Driver">
            <i class="fa-solid fa-shield-check"></i>
          </div>
        </div>
        <h2 id="displayName">Loading...</h2>
        <p class="badge"><i class="fa-solid fa-circle-check"></i> EV Club Member</p>
        
        <div class="mini-stats-stack">
          <div class="mini-stat-tile">
            <div class="mini-stat-icon"><i class="fa-solid fa-calendar-check"></i></div>
            <div class="mini-stat-info">
              <h4 id="statBookings">0</h4>
              <span>Total Bookings</span>
            </div>
          </div>
          <div class="mini-stat-tile">
            <div class="mini-stat-icon"><i class="fa-solid fa-star"></i></div>
            <div class="mini-stat-info">
              <h4 id="statRating">4.9★</h4>
              <span>User Rating</span>
            </div>
          </div>
          <div class="mini-stat-tile">
            <div class="mini-stat-icon"><i class="fa-solid fa-seedling"></i></div>
            <div class="mini-stat-info">
              <h4 id="statSaved">0</h4>
              <span>CO₂ Saved (kg)</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Details Card -->
      <div class="profile-details-card">
        <div>
          <h3><i class="fa-solid fa-circle-info"></i> Account Information</h3>
          <div class="details-grid" id="detailsGrid">
            
            <div class="detail-box">
              <div class="detail-icon"><i class="fa-solid fa-signature"></i></div>
              <div class="detail-content">
                <label>Full Name</label>
                <p id="viewName">-</p>
                <input id="inputName" type="text">
              </div>
            </div>

            <div class="detail-box">
              <div class="detail-icon"><i class="fa-solid fa-envelope"></i></div>
              <div class="detail-content">
                <label>Email Address</label>
                <p id="viewEmail">-</p>
                <input id="inputEmail" type="email">
              </div>
            </div>

            <div class="detail-box">
              <div class="detail-icon"><i class="fa-solid fa-phone"></i></div>
              <div class="detail-content">
                <label>Phone Number</label>
                <p id="viewPhone">-</p>
                <input id="inputPhone" type="text">
              </div>
            </div>

            <div class="detail-box" id="vehicleDetailBox">
              <div class="detail-icon"><i class="fa-solid fa-car"></i></div>
              <div class="detail-content">
                <label>Vehicle Number</label>
                <p id="viewVehicle">-</p>
                <input id="inputVehicle" type="text">
              </div>
            </div>

          </div>
        </div>

        <!-- Action Row -->
        <div class="actions-row">
          <button class="btn-edit" id="editBtn" onclick="toggleEdit()">
            <i class="fa-solid fa-user-pen"></i> <span id="editBtnLabel">Edit Profile</span>
          </button>

          <button class="btn-password" onclick="openPasswordModal()">
            <i class="fa-solid fa-key"></i> Change Password
          </button>

          <button class="btn-logout" onclick="logout()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
          </button>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- Change Password Modal -->
<div class="modal-overlay" id="passwordModal">
  <div class="modal-box">
    <h3>🔐 Change Password</h3>
    <input type="password" id="currentPassword" placeholder="Current password">
    <input type="password" id="newPassword" placeholder="New password">
    <input type="password" id="confirmPassword" placeholder="Confirm new password">
    <div class="modal-error-msg" id="passwordMsg"></div>
    <div class="modal-buttons">
      <button class="btn-modal-cancel" onclick="closePasswordModal()">Cancel</button>
      <button class="btn-modal-save" onclick="savePassword()">Save Password</button>
    </div>
  </div>
</div>

<script>
const USER_KEY = "loggedUser";
const API_BASE = "https://ev-finder-project-production-2026.up.railway.app/api/users";

function loadUser() {
  const raw = localStorage.getItem(USER_KEY);
  if (!raw) {
    window.location.href = "login.html";
    return null;
  }
  return JSON.parse(raw);
}

// Check if user is Admin, hide vehicle input container
function checkAdminLayout(user) {
  if (user && user.role && user.role.toUpperCase() === "ADMIN") {
    const vBox = document.getElementById("vehicleDetailBox");
    if (vBox) vBox.style.display = "none";
  }
}

function saveUserLocally(user) {
  localStorage.setItem(USER_KEY, JSON.stringify(user));
}

let currentUser = loadUser();

function renderUser() {
  if (!currentUser) return;

  const displayName = currentUser.fullName || currentUser.name || "-";

  document.getElementById("displayName").textContent = displayName;
  document.getElementById("viewName").textContent = displayName;
  document.getElementById("viewEmail").textContent = currentUser.email || "-";
  document.getElementById("viewPhone").textContent = currentUser.phone || "-";
  
  // Clean Vehicle Display
  const vNum = currentUser.vehicleNumber || currentUser.vehicle || "-";
  document.getElementById("viewVehicle").textContent = vNum;

  // Profile picture image loading
  const profileImg = currentUser.profileImage || currentUser.avatar;
  if (profileImg) {
    const avatarElem = document.getElementById("avatar");
    if (avatarElem) avatarElem.src = profileImg;

    const profileIcon = document.querySelector(".topbar .profile");
    if (profileIcon) {
      profileIcon.innerHTML = `<img src="${profileImg}" style="width:100%;height:100%;border-radius:16px;object-fit:cover;">`;
    }
  }

  document.getElementById("inputName").value = displayName === "-" ? "" : displayName;
  document.getElementById("inputEmail").value = currentUser.email || "";
  document.getElementById("inputPhone").value = currentUser.phone || "";
  document.getElementById("inputVehicle").value = vNum === "-" ? "" : vNum;

  // Dynamic booking history count
  fetch(`https://ev-finder-project-production-2026.up.railway.app/api/bookings`)
    .then(res => res.json())
    .then(bookings => {
      // Count user's bookings (filter by email match or name fallback)
      const userBookings = bookings.filter(b => {
        if (b.customerEmail && currentUser.email) {
          return b.customerEmail.toLowerCase() === currentUser.email.toLowerCase();
        }
        return b.customerName === displayName || b.vehicleNumber === vNum;
      });
      document.getElementById("statBookings").textContent = userBookings.length;
      
      // Calculate dynamic CO2 saved (average 15kg CO2 saved per session compared to fuel vehicles)
      const activeBookings = userBookings.filter(b => b.paymentStatus !== "Cancelled");
      document.getElementById("statSaved").textContent = activeBookings.length * 15;
    })
    .catch(err => {
      console.warn("Could not load booking count stats dynamically:", err);
      document.getElementById("statBookings").textContent = 0;
      document.getElementById("statSaved").textContent = 0;
    });

  document.getElementById("statRating").textContent = "4.9 ★";
  
  checkAdminLayout(currentUser);
}

renderUser();

// ---- PROFILE IMAGE UPLOAD ----
function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    alert("Please select a valid image file.");
    return;
  }

  const reader = new FileReader();
  reader.onload = async function (e) {
    const base64Image = e.target.result;
    document.getElementById("avatar").src = base64Image;

    const profileIcon = document.querySelector(".topbar .profile");
    if (profileIcon) {
      profileIcon.innerHTML = `<img src="${base64Image}" style="width:100%;height:100%;border-radius:16px;object-fit:cover;">`;
    }

    currentUser.profileImage = base64Image;
    currentUser.avatar = base64Image;
    saveUserLocally(currentUser);

    if (currentUser.id) {
      try {
        await fetch(`${API_BASE}/${currentUser.id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fullName: currentUser.fullName || currentUser.name,
            email: currentUser.email,
            phone: currentUser.phone,
            vehicleNumber: currentUser.vehicleNumber || currentUser.vehicle,
            profileImage: base64Image
          })
        });
      } catch (err) {
        console.warn("Could not sync profile image to backend:", err);
      }
    }

    alert("Profile picture updated successfully! 📷");
  };
  reader.readAsDataURL(file);
}

// ---- EDIT PROFILE ----
let isEditing = false;

async function toggleEdit() {
  const card = document.getElementById("detailsGrid");
  isEditing = !isEditing;

  if (isEditing) {
    card.classList.add("editing");
    document.getElementById("editBtnLabel").textContent = "Save Profile";
    return;
  }

  const nameVal = document.getElementById("inputName").value.trim();
  const emailVal = document.getElementById("inputEmail").value.trim();
  const phoneVal = document.getElementById("inputPhone").value.trim();
  const vehicleVal = document.getElementById("inputVehicle").value.trim();

  if (!nameVal || !emailVal || !phoneVal) {
    alert("Name, Email, and Phone are required!");
    isEditing = true;
    return;
  }

  const updated = {
    ...currentUser,
    name: nameVal,
    fullName: nameVal,
    email: emailVal,
    phone: phoneVal,
    vehicleNumber: vehicleVal,
    vehicle: vehicleVal
  };

  // Sync profile details using REST Put call to backend
  try {
    const response = await fetch(`${API_BASE}/${currentUser.id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        fullName: updated.fullName,
        email: updated.email,
        phone: updated.phone,
        vehicleNumber: updated.vehicleNumber,
        profileImage: currentUser.profileImage || currentUser.avatar || null
      })
    });

    if (!response.ok) {
      throw new Error("Update status failed with " + response.status);
    }
    
    // Success: Parse updated entity response
    const updatedEntity = await response.json();
    currentUser = {
      ...updated,
      ...updatedEntity
    };
  } catch(err) {
    console.warn("Backend profile sync failed, saved locally only:", err);
    currentUser = updated;
  }

  saveUserLocally(currentUser);
  renderUser();

  card.classList.remove("editing");
  document.getElementById("editBtnLabel").textContent = "Edit Profile";
}

// ---- CHANGE PASSWORD ----
function openPasswordModal() {
  document.getElementById("passwordModal").classList.add("active");
  document.getElementById("currentPassword").value = "";
  document.getElementById("newPassword").value = "";
  document.getElementById("confirmPassword").value = "";
  document.getElementById("passwordMsg").textContent = "";
}

function closePasswordModal() {
  document.getElementById("passwordModal").classList.remove("remove"); // safety
  document.getElementById("passwordModal").classList.remove("active");
}

async function savePassword() {
  const current = document.getElementById("currentPassword").value;
  const next = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const msg = document.getElementById("passwordMsg");

  if (current !== (currentUser.password || "")) {
    msg.style.color = "#ef4444";
    msg.textContent = "Current password is incorrect.";
    return;
  }
  if (next.length < 6) {
    msg.style.color = "#ef4444";
    msg.textContent = "New password must be at least 6 characters.";
    return;
  }
  if (next !== confirm) {
    msg.style.color = "#ef4444";
    msg.textContent = "New passwords do not match.";
    return;
  }

  try {
    const response = await fetch(`${API_BASE}/${currentUser.id}/change-password`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ newPassword: next })
    });

    if (!response.ok) {
      throw new Error("Change password returned " + response.status);
    }
  } catch(err) {
    console.warn("Backend password update failed, saved locally:", err);
  }

  currentUser.password = next;
  saveUserLocally(currentUser);

  msg.style.color = "#22c55e";
  msg.textContent = "Password updated successfully!";

  setTimeout(closePasswordModal, 1200);
}

// ---- LOGOUT ----
function logout() {
  localStorage.removeItem(USER_KEY);
  window.location.href = "login.html";
}
